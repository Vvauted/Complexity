name: Build and documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "Complexity Ram ram-demo"
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build CSLib integration
        working-directory: integrations/cslib
        run: lake build RamCslib
      - name: Build Lean documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: docbuild
        run: lake build Complexity:docs Ram:docs
      - name: Upload documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docbuild/.lake/build/doc

  deploy-docs:
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Lean documentation
        id: deployment
        uses: actions/deploy-pages@v4
